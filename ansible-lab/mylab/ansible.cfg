[defaults]
inventory = hosts.ini
remote_user = kaldreth
forks = 10
host_key_checking = False

gathering = smart
#fact_caching = jsonfile
#fact_connection = /tmp/ansible_facts
#fact_caching_timeout = 86400

strategy = linear

[privilege_escalation]
become = true
become_method = sudo
become_user = root
become_ask_pass = True

[connection]
pipelining = True

