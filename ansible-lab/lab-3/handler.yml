---
- name: Start and Enable apache2 using handler
  hosts: all
  become: true
  roles:
    - webserver

  tasks:
    - name: Install Apache http server
      ansible.builtin.package:
        name: apache2
        state: present
      notify: start and enable service

    # Creates /var/www/app defined in document_root
    - name: Ensure DocumentRoot directories exist
      ansible.builtin.file:
        path: "{{ item.document_root }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'
      loop: "{{ vhosts }}"

    - name: Create VirtualHost configuration from template
      ansible.builtin.template:
        src: roles/webserver/templates/apache.conf.j2
        dest: "/etc/apache2/sites-available/{{ item.server_name }}.conf"
        owner: root
        group: root
        mode: '0644'
      loop: "{{ vhosts }}"
      notify: Reload service

    - name: Enable VirtualHost site
      ansible.builtin.command: "a2ensite {{ item.server_name }}.conf"
      args:
        creates: "/etc/apache2/sites-enabled/{{ item.server_name }}.conf"
      loop: "{{ vhosts }}"
      notify: Reload service

  handlers:
    - name: start and enable service
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: true

    - name: Reload service
      ansible.builtin.service:
        name: apache2
        state: reloaded

    - name: Restart service
      ansible.builtin.service:
        name: apache2
        state: restarted  
