---
# vars file for roles/webserver
vhosts:
  - server_name: "bestwebsite.com"
    server_aliases:
      - "www.bestwebsite.com"
    document_root: "/var/www/app"
    http_port: 80
    allow_override: "All"
    env_vars:
      APP_ENV: "production"
      APP_DEBUG: "false"
    ssl_enabled: false
