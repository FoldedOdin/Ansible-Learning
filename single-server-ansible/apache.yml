---
- name: Install and configure Apache
  hosts: webservers
  become: true
  vars:
    apache_port: 8080
  tasks:
    - name: Install httpd
      ansible.builtin.dnf:
        name: httpd
        state: present

    - name: Deploy test page
      ansible.builtin.copy:
        content: "<h1>Apache deployed by Ansible</h1>\n"
        dest: /var/www/html/index.html
      notify: Restart httpd

    - name: Start and enable httpd
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true

    - name: Open HTTP in firewalld
      ansible.posix.firewalld:
        service: http
        permanent: true
        immediate: true
        state: enabled

  handlers:
    - name: Restart httpd
      ansible.builtin.service:
        name: httpd
        state: restarted
