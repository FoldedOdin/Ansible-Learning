---
- name: Install apache
  dnf:
    name: httpd
    state: present
- name: Start and Enable Apache
  service:
    name: httpd
    state: started
    enabled: true
- name: Configure Website
  template:
    src: templates/index.html.j2
    dest: /var/www/html/index.html
  notify: restart httpd
